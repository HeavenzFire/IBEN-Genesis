[package]
name = "aero-sovereign"
version = "0.1.0"
description = "Windows 7 Rebirth - Aero-Sovereign Desktop Environment Backend"
authors = ["Aero Sovereign Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["shell-open"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
aes-gcm = "0.10"
base64 = "0.21"
reqwest = { version = "0.11", features = ["blocking", "json"] }
regex = "1.10"
dirs = "5.0"

# Substrate 01: Zero-Copy Memory Bus
memmap2 = "0.9"

# Substrate 02: Deterministic Sandboxed WASM Engine
wasmtime = "19.0"

# Substrate 03: Encrypted P2P Mesh Gossip Protocol
libp2p = { version = "0.54", features = ["tcp", "noise", "yamux", "gossipsub", "mdns", "dns", "tokio"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
